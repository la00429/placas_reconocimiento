name: Build and Deploy to Railway

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Descargar modelos ANTES del build
      - name: Download YOLO model
        run: |
          curl -L -o yolov8s.pt "https://github.com/ultralytics/assets/releases/download/v8.4.0/yolov8s.pt"
          ls -la yolov8s.pt
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build image
        run: |
          docker build -t coffee-chill:latest .
      
      # Deploy a Railway con imagen pre-build
      - name: Deploy to Railway
        uses: railway/cli@v3
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
